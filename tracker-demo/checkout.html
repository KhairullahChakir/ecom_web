<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - ShopDemo</title>
    <meta name="description" content="Complete your purchase securely.">
    <link rel="stylesheet" href="/src/style.css">
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar">
        <a href="/" class="logo">Shop<span>Demo</span></a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/products.html">Products</a>
            <a href="/about.html">About</a>
            <a href="/cart.html" class="cart-link">
                Cart <span class="cart-count" id="cart-count">0</span>
            </a>
        </div>
    </nav>

    <!-- Checkout -->
    <div class="section-header">
        <h2>Checkout</h2>
        <p>Complete your order</p>
    </div>

    <div class="checkout-container">
        <div class="checkout-form">
            <!-- Shipping -->
            <div class="form-section">
                <h3>Shipping Information</h3>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label>Shipping Address</label>
                    <input type="text" id="address" placeholder="123 Main Street">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>City</label>
                        <input type="text" id="city" placeholder="New York">
                    </div>
                    <div class="form-group">
                        <label>Zip Code</label>
                        <input type="text" id="zip" placeholder="10001">
                    </div>
                </div>
            </div>

            <!-- Payment -->
            <div class="form-section" style="margin-top: 2rem;">
                <h3>Payment Details</h3>
                <div class="form-group">
                    <label>Card Number</label>
                    <input type="text" id="cardNumber" placeholder="4242 4242 4242 4242">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Expiry Date</label>
                        <input type="text" id="expiry" placeholder="MM/YY">
                    </div>
                    <div class="form-group">
                        <label>CVC</label>
                        <input type="text" id="cvc" placeholder="123">
                    </div>
                </div>
            </div>

            <!-- Submit -->
            <button class="btn btn-primary" onclick="completePurchase()"
                style="width: 100%; margin-top: 1.5rem; padding: 1rem; font-size: 1rem;">
                Complete Purchase
            </button>
        </div>
    </div>

    <!-- Tracker Notice -->
    <div class="tracker-notice">
        <div class="tracker-badge">
            <span class="dot"></span>
            Page Type: Administrative (Checkout)
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <strong>ShopDemo</strong> &mdash; OP-ECOM Analytics Demo
        <p class="tracker-info">Powered by AI-driven exit intent prediction</p>
    </footer>

    <script src="http://localhost:8001/tracker/static/tracker.js" data-api="http://localhost:8001"></script>
    <script src="/src/main.js"></script>
</body>

</html>
