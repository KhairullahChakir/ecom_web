<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - ShopDemo</title>
    <meta name="description" content="Review your shopping cart and proceed to checkout.">
    <link rel="stylesheet" href="/src/style.css">
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar">
        <a href="/" class="logo">Shop<span>Demo</span></a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/products.html">Products</a>
            <a href="/about.html">About</a>
            <a href="/cart.html" class="cart-link active">
                Cart <span class="cart-count" id="cart-count">0</span>
            </a>
        </div>
    </nav>

    <!-- Cart Section -->
    <div class="section-header">
        <h2>Your Cart</h2>
        <p>Review your items before checkout</p>
    </div>

    <div class="cart-container">
        <div id="cart-items"></div>
        <div class="cart-summary" id="cart-summary" style="display:none;">
            <p class="cart-total">Total: <span class="amount" id="cart-total">$0.00</span></p>
            <a href="/checkout.html" class="btn btn-primary">Proceed to Checkout</a>
        </div>
    </div>

    <!-- Tracker Notice -->
    <div class="tracker-notice">
        <div class="tracker-badge">
            <span class="dot"></span>
            Page Type: Administrative
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <strong>ShopDemo</strong> &mdash; OP-ECOM Analytics Demo
        <p class="tracker-info">Powered by AI-driven exit intent prediction</p>
    </footer>

    <script src="http://localhost:8002/tracker/static/tracker.js" data-api="http://localhost:8002"></script>
    <script src="/src/main.js"></script>
</body>

</html>
