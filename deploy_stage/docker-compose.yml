version: '3.8'

services:
  # 1. MariaDB: The data foundation
  db:
    image: mariadb:10.6
    container_name: op-ecom-db
    ports:
      - "3307:3306"
    environment:
      - MARIADB_ROOT_PASSWORD=root
      - MARIADB_DATABASE=op_ecom_tracker
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./tracker/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped

  # 2. Prediction API: The AI Brain (TabM)
  backend:
    build:
      context: ./backend
    container_name: op-ecom-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/models:/app/models
    environment:
      - ENVIRONMENT=production
    restart: unless-stopped
    depends_on:
      - db

  # 3. Analytics Tracker: The Collector (TCN)
  tracker:
    build:
      context: ./tracker
    container_name: op-ecom-tracker
    ports:
      - "8002:8002"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=op_ecom_tracker
      - PREDICTION_API_URL=http://backend:8000/predict
    depends_on:
      - db
      - backend
    restart: unless-stopped

  # 4. Admin Dashboard: The Control Panel (Next.js)
  admin:
    build:
      context: ./frontend
    container_name: op-ecom-admin
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  # 5. Shop Demo: The Public Website (Vite/Nginx)
  shop:
    build:
      context: ./tracker-demo
    container_name: op-ecom-shop
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  mariadb_data:
